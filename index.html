<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cyra Press LLC — independent publisher of software, reference works, digital editions, and educational publications.">
  <title>Cyra Press LLC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Primary">
      <span class="tiny-dash" aria-hidden="true"></span>
      <button type="button">Collection</button>
      <button type="button">Publications</button>
      <button type="button">Software</button>
      <button type="button">Journal</button>
      <button type="button">About</button>
      <button type="button">Contact</button>
    </nav>
  </header>

  <main class="layout">
    <section class="hero" aria-labelledby="brand-title">
      <div class="brand-lockup">
        <h1 id="brand-title">CYRA</h1>
        <p class="press-label">PRESS LLC</p>
      </div>

      <aside class="black-panel" aria-label="Cyra Press">
        <span class="panel-dash" aria-hidden="true"></span>
        <p>CYRA PRESS LLC</p>
      </aside>
    </section>

    <section class="lower-grid">
      <div class="intro">
        <span class="intro-dash" aria-hidden="true"></span>
        <p>
          Independent publisher of software, reference works,
          digital editions, and educational materials.
        </p>
      </div>

      <div class="link-grid" aria-label="Future sections">
        <button type="button">
          <span class="number">01</span>
          <span class="sandwich-label">Collection</span>
        </button>

        <button type="button">
          <span class="number">02</span>
          <span class="sandwich-label">Publications</span>
        </button>

        <button type="button">
          <span class="number">03</span>
          <span class="sandwich-label">Software</span>
        </button>

        <button type="button">
          <span class="number">04</span>
          <span class="sandwich-label">Journal</span>
        </button>

        <button type="button">
          <span class="number">05</span>
          <span class="sandwich-label">About</span>
        </button>

        <button type="button">
          <span class="number">06</span>
          <span class="sandwich-label">Contact</span>
        </button>
      </div>
    </section>

    <footer class="site-footer">
      <span>CYRA PRESS LLC</span>
      <span>EDITION 001</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
